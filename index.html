<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sock Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #f0f0f0;
        font-family: 'Nunito', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
      }

      .container {
        background: white;
        border: 1px solid #d9d9d9;
        padding: 20px;
        max-width: 1100px; 
        width: 95%;
        border-radius: 15px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      }

      h1 {
        margin-top: 0;
        color: #ffab19;
        font-weight: 800;
        font-size: 2.5em;
        text-align: center;
        margin-bottom: 20px;
      }

      .version-selector {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .version-btn {
        background-color: #4d97ff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        box-shadow: 0px 4px 0px #3d76c9;
        font-size: 0.9em;
      }

      .version-btn:hover {
        background-color: #3373cc;
      }

      .version-btn:active {
        transform: translateY(3px);
        box-shadow: 0px 1px 0px #3d76c9;
      }

      .version-btn.active {
        background-color: #ffab19;
        box-shadow: 0px 4px 0px #cf8b11;
      }

      .emulator-container {
        width: 100%;
        aspect-ratio: 16 / 10; 
        border: 2px solid #bdc3c7;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .controls-hint {
        background: #855cd6;
        color: white;
        padding: 12px;
        margin-top: 20px;
        border-radius: 10px;
        font-size: 0.95em;
        text-align: center;
      }

      .controls-hint a {
        color: #ffab19;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>Sprunks slop</h1>

      <div class="version-selector">
        <button class="version-btn" onclick="changeVersion('2006', this)">2006</button>
        <button class="version-btn active" onclick="changeVersion('1.0', this)">Scratch 1.0</button>
        <button class="version-btn" onclick="changeVersion('1.4beta', this)">Beta 1.4</button>
        <button class="version-btn" onclick="changeVersion('1.4rc', this)">1.4 (Release Candidate)</button>
        <button class="version-btn" onclick="changeVersion('1.4', this)">1.4.0.7</button>
      </div>
      
      <div class="emulator-container">
        <iframe 
          id="kirk"
          src="https://scratcharchive.naleksuh.com/?run=Scratch1.0.image" 
          allowfullscreen>
        </iframe>
      </div>

      <div class="controls-hint">
        <strong>NOTE:</strong> i didnt make these, they were created by  
        <a href="https://sunshinelover.neocities.org/" target="_blank">Sunshinelover</a>.
      </div>
    </div>

    <script>
      function changeVersion(version, element) {
        const iframe = document.getElementById('scratch-iframe');
        
        const versions = {
          'Good Ending screen': "https://scratcharchive.naleksuh.com/?run=Scratch27Jul06.image",
          'sprunksbox': "https://scratcharchive.naleksuh.com/?run=Scratch1.0.image",
          'sprunks 2 prototype': "https://scratcharchive.naleksuh.com/?run=Scratch1.4beta.image",
          'sprunksbox v2': "https://scratcharchive.naleksuh.com/?run=Scratch1.4rc.image",
          'super sprunksbox': "https://scratcharchive.naleksuh.com/?run=Scratch1.4.0.7.image"
        };

        if (versions[version]) {
          iframe.src = versions[version];
        }

        const buttons = document.querySelectorAll('.version-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
      }
    </script>

  </body>
</html>
